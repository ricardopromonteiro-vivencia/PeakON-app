<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradiente azul escuro → azul médio (linhas da esquerda/base) -->
    <linearGradient id="gLeft" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#2a4fd6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Gradiente azul médio → cyan (linha da frente / seta) -->
    <linearGradient id="gRight" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06d6c7"/>
    </linearGradient>
    <!-- Gradiente geral da esquerda para a direita -->
    <linearGradient id="gFull" x1="0%" y1="80%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2a4fd6"/>
      <stop offset="50%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06d6c7"/>
    </linearGradient>
    <!-- Clip circular -->
    <clipPath id="circle">
      <circle cx="256" cy="256" r="248"/>
    </clipPath>
  </defs>

  <!-- Fundo circular azul escuro (#0d1b4b) -->
  <circle cx="256" cy="256" r="256" fill="#0d1b4b"/>

  <!-- Grupo recortado no círculo -->
  <g clip-path="url(#circle)">

    <!--
      LÓGICA DA IMAGEM:
      - 3 linhas paralelas curvas que sobem da esq./baixo para dir./cima
      - Formam picos de montanha no meio
      - A mais à frente (direita) vira seta e tem círculo no topo
      - A seta aponta para cima-direita (~45°)
    -->

    <!-- LINHA 1 — mais à esquerda/trás, azul escuro, mais fina -->
    <path d="
      M 60 420
      C 80 390, 110 360, 145 330
      C 170 308, 185 295, 195 275
      C 207 252, 200 232, 215 210
      C 228 192, 248 178, 262 160
      C 272 147, 278 138, 278 138
    "
    fill="none"
    stroke="#2a4fd6"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.75"/>

    <!-- LINHA 2 — do meio -->
    <path d="
      M 85 435
      C 105 405, 135 374, 170 344
      C 196 320, 210 307, 220 287
      C 232 263, 225 243, 240 221
      C 253 201, 274 186, 288 168
      C 298 155, 304 146, 304 146
    "
    fill="none"
    stroke="url(#gFull)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.88"/>

    <!-- LINHA 3 — mais à frente/direita, cyan, forma a seta -->
    <!-- Parte curva (base) -->
    <path d="
      M 112 450
      C 132 418, 162 388, 198 358
      C 224 334, 238 320, 248 299
      C 260 275, 253 255, 268 232
      C 282 211, 302 196, 317 177
    "
    fill="none"
    stroke="url(#gFull)"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"/>

    <!-- Parte reta (haste da seta) -->
    <line x1="317" y1="177" x2="390" y2="102"
          stroke="#06d6c7"
          stroke-width="24"
          stroke-linecap="round"/>

    <!-- Cabeça da seta — triângulo apontado para cima-direita -->
    <polygon
      points="413,78  375,98  396,118"
      fill="#06d6c7"/>

    <!-- Círculo do atleta no topo (acima da seta) -->
    <circle cx="422" cy="66" r="26" fill="#06d6c7"/>

  </g>

  <!-- Texto PeakON em baixo -->
  <text
    x="256" y="468"
    font-family="Inter, Arial Black, sans-serif"
    font-size="82"
    font-weight="800"
    fill="white"
    text-anchor="middle"
    letter-spacing="-1">PeakON</text>
</svg>
